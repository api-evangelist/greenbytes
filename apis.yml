name: GreenBytes
description: GreenBytes was a data-storage and desktop-virtualization company (patented VDI IO-offload and inline
  data deduplication) backed by Battery Ventures, and was acquired by Oracle in June 2014. Its product line was
  absorbed into Oracle and the former green-bytes.com domain now redirects to Oracle Support. The company has no
  independent, active developer portal, OpenAPI definition, or public API surface, so the enrichment pipeline found
  no real API artifacts to add. It is retained in the API Evangelist network as a historical Battery Ventures portfolio-lead
  stub.
